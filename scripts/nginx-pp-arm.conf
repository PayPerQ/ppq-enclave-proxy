# The api arm of the stream context, on its own: PROXY protocol v2 toward the
# enclave for api.ppq.ai. This is the block scripts/nginx-sni-split.conf
# documents under "The api arm"; it exists separately for the DEV box, which
# runs no nginx today (its inbound forwarder sits straight on :443) and so has
# no stream context to add the arm to. See DEV-ENCLAVE.md, "Testing PROXY
# protocol on the dev box".
#
#   8445  public: the api NLB's target port (client-IP preservation ON), or,
#         on the dev box, the port you open in the security group and curl.
#   8446  loopback: the socat run-host.sh starts with INBOUND_PP_LISTEN_PORT=8446,
#         which feeds enclave vsock:8445. Only nginx may write to it, because
#         the PROXY header is an unauthenticated claim about the client's
#         address; never expose 8446.
#
# nginx does not terminate TLS here: ssl_preread only parses the ClientHello,
# and the connection reaches the enclave byte-for-byte after the header.
#
# Install: the stream module is a separate package on Amazon Linux 2023
# (`dnf install -y nginx nginx-mod-stream`; the module conf lands in
# /usr/share/nginx/modules/, which nginx.conf includes). Then append this
# file to /etc/nginx/nginx.conf at TOP LEVEL (conf.d/*.conf is included
# inside the http block, where a stream block cannot live), and
# `nginx -t && systemctl reload nginx`.
stream {
    server {
        listen 8445;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass 127.0.0.1:8446;
        proxy_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
