# The api arm of the stream context, on its own: PROXY protocol toward the
# enclave for api.ppq.ai. This is the block scripts/nginx-sni-split.conf
# documents under "The api arm"; it exists separately for the DEV box, which
# runs no nginx today (its inbound forwarder sits straight on :443) and so has
# no stream context to add the arm to. See DEV-ENCLAVE.md, "Testing PROXY
# protocol on the dev box".
#
#   8445               public: the api NLB's target port (client-IP
#                      preservation ON, and NO proxy_protocol_v2 attribute --
#                      see below), or, on the dev box, the port you open in the
#                      security group and curl.
#   /run/ppq/pp.sock   the unix socket run-host.sh listens on when
#                      INBOUND_PP_SOCKET=/run/ppq/pp.sock (the path must be
#                      under the dedicated /run/ppq), feeding enclave
#                      vsock:8445. Mode 660 root:nginx in a 750 root:nginx
#                      directory: only root and nginx's workers can write to
#                      it, so no other local user can forge a header.
#
# WHAT NGINX WRITES, AND WHAT IT MUST NOT RECEIVE. `proxy_protocol on` makes
# nginx prepend the v1 TEXT line ("PROXY TCP4 <src> <dst> <sport> <dport>")
# carrying the peer it accepted the connection from. That peer is the real
# client only if the NLB preserves client IPs at the TCP level, which is the
# target-group attribute `preserve_client_ip.enabled=true`. The NLB's OTHER
# attribute, `proxy_protocol_v2.enabled`, must stay OFF for this target
# group: this listener does not parse an inbound PROXY header (that would be
# `listen 8445 proxy_protocol;`, deliberately absent), so a v2 header from
# the NLB would be forwarded as bytes and the enclave would see two headers.
# The enclave's v2 support exists for a future no-nginx variant (NLB v2
# straight into socat), not for this arm.
#
# nginx does not terminate TLS here: ssl_preread only parses the ClientHello,
# and the connection reaches the enclave byte-for-byte after the header.
#
# Install (DEV-ENCLAVE.md has the exact commands): the stream module is a
# separate package on Amazon Linux 2023 (`dnf install -y nginx
# nginx-mod-stream`; the module conf lands in /usr/share/nginx/modules/, which
# nginx.conf includes). Copy this file to /etc/nginx/ppq-pp-arm.conf and add
# `include /etc/nginx/ppq-pp-arm.conf;` at the TOP LEVEL of nginx.conf
# (conf.d/*.conf is included inside the http block, where a stream block
# cannot live). This file carries its own `stream {}`; a box that already has
# one (production, nginx-sni-split.conf) takes the server block inside it
# instead, since `stream` may appear only once.
stream {
    server {
        listen 8445;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass unix:/run/ppq/pp.sock;
        proxy_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
