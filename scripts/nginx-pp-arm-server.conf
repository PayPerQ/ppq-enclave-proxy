# The api arm's server block ALONE, for a box whose nginx.conf already carries
# a top-level `stream {}` (production: scripts/nginx-sni-split.conf, where
# `stream` may appear only once). scripts/install-pp-arm.sh installs this as
# /etc/nginx/stream.d/ppq-pp-arm.conf and adds one include line inside that
# stream block. It must stay identical to the server block inside
# scripts/nginx-pp-arm.conf, which is the same arm wrapped in its own
# stream {} for a box with no stream context (the dev box);
# enclave/test/ppArmConf.test.mjs checks the two agree. What the block does,
# and what the NLB in front of it must and must not do, is documented there.
server {
    listen 8445;
    ssl_preread on;
    proxy_protocol on;
    proxy_pass unix:/run/ppq/pp.sock;
    proxy_timeout 300s;
    proxy_connect_timeout 10s;
}
