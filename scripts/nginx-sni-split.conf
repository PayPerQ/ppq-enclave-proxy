# SNI split on :443 — phase 1 of #52 (TLS termination inside the enclave).
#
# THE PROBLEM THIS SOLVES
# -----------------------
# TLS-ALPN-01 proves domain control inside a TLS handshake on port 443
# specifically; the CA will not use another port. But nginx owns :443 and
# terminates everything, so a validation for the shadow hostname would be
# answered by nginx with nginx's certificate, and the enclave would never see
# the handshake it needs to answer.
#
# ssl_preread reads the SNI out of the ClientHello WITHOUT terminating, so one
# listener can route by hostname while leaving the TLS end-to-end. nginx on the
# box is 1.30.2 built --with-stream_ssl_preread_module, so no rebuild is needed.
#
# WHAT CHANGES AND WHAT DOES NOT
# ------------------------------
#   enclave.ppq.ai        -> unchanged. Still terminated by the http server,
#                            still the EHBP path, still the same certificate.
#                            It just arrives via loopback instead of the wire.
#   enclave-direct.ppq.ai -> raw TCP to the enclave, which terminates the TLS
#                            itself and can therefore answer acme-tls/1.
#   anything else         -> the http server, i.e. today's behaviour.
#
# Host-side only. Nothing here is measured, so this costs no PCR0 rotation and
# can be reverted by restoring the previous conf and reloading.
#
# This is also the mechanism phase 3 needs wholesale: once the enclave holds a
# browser-trusted certificate, enclave.ppq.ai moves to the same passthrough
# branch and the http server goes away entirely.

# ── stream: owns the public :443 and never terminates ────────────────────────
stream {
    map $ssl_preread_server_name $enclave_upstream {
        # Shadow hostname. Straight through to socat -> vsock -> enclave.
        # NO proxy_protocol on this branch: the enclave runs a plain TLS
        # server and would read the PROXY header as ClientHello garbage.
        enclave-direct.ppq.ai  127.0.0.1:8443;

        # Everything else, including enclave.ppq.ai, keeps being terminated by
        # the http server below. `default` rather than an explicit hostname so
        # an unrecognised SNI degrades to today's behaviour instead of being
        # handed to the enclave.
        default                127.0.0.1:8444;
    }

    # Only the terminating branch gets PROXY protocol, so the http server can
    # still see the real client address instead of 127.0.0.1.
    map $ssl_preread_server_name $enclave_proxy_protocol {
        enclave-direct.ppq.ai  off;
        default                on;
    }

    log_format sni '$remote_addr [$time_local] sni=$ssl_preread_server_name '
                   '-> $upstream_addr $status $bytes_sent';
    access_log /var/log/nginx/sni-split.log sni;

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $enclave_upstream;
        proxy_protocol $enclave_proxy_protocol;

        # Long enough for streaming completions, which is what this carries.
        proxy_timeout 300s;
        proxy_connect_timeout 10s;
    }
}

# ── http: the existing terminator, moved off the wire onto loopback ──────────
#
# Replaces the `listen 443 ssl` block in enclave.conf. The only changes are the
# listen line and the real-ip directives; the certificate, the CORS header the
# browser EHBP client needs, and the streaming settings are all as they were.
server {
    listen 127.0.0.1:8444 ssl proxy_protocol;
    server_name enclave.ppq.ai;

    # The connection now arrives from the stream block, so the peer address is
    # loopback. Trust the PROXY header for the real client address, and trust it
    # ONLY from loopback.
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/letsencrypt/live/enclave.ppq.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enclave.ppq.ai/privkey.pem;

    location / {
        proxy_pass https://127.0.0.1:8443;   # -> socat -> vsock -> enclave
        proxy_ssl_verify off;                # enclave uses an ephemeral self-signed cert

        # The browser's ehbp client must READ this response header from
        # cross-origin JS to decrypt the response. Without exposing it the fetch
        # succeeds but the header is hidden -> ProtocolError. Node ignores CORS,
        # so this only ever breaks in a real browser.
        add_header 'Access-Control-Expose-Headers' 'Ehbp-Response-Nonce' always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Streaming (SSE / EHBP chunk frames): don't buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}
