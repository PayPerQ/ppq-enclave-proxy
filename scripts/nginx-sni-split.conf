# DEPLOYED 2026-09-03 on i-0609bf23c4b57a48e. This file is the record of what is
# actually running, not a proposal.
#
# PREREQUISITE THAT WAS NOT OBVIOUS: `nginx -V` reports
# --with-stream_ssl_preread_module, which I first read as "already available".
# It is not. On Amazon Linux 2023 the stream module is DYNAMIC and its binaries
# ship in a separate package that was not installed -- /usr/share/nginx/modules/
# was empty and no ngx_stream*.so existed anywhere on the box. Installing it:
#
#     dnf install -y nginx-mod-stream     # must match nginx exactly (1.30.2)
#
# drops mod-stream.conf into /usr/share/nginx/modules/, which nginx.conf already
# includes, so the module loads on the next reload.
#
# LAYOUT: nginx.conf includes conf.d/*.conf INSIDE the http block, so a stream
# block cannot live there. The stream section below is appended to
# /etc/nginx/nginx.conf at top level; the server section replaces
# /etc/nginx/conf.d/enclave.conf.
#
# VERIFIED AFTER RELOAD:
#   enclave-direct.ppq.ai -> subject/issuer CN=ppq-enclave-proxy  (the ENCLAVE's
#                            own self-signed cert: TLS terminates inside it)
#   enclave.ppq.ai        -> issuer Let's Encrypt, CN=enclave.ppq.ai (unchanged)
#   both report the same attested cert_spki_sha256, i.e. the same enclave
#   production chat + attestation both still HTTP 200
#
# ── appended to /etc/nginx/nginx.conf (top level) ────────────────────────────

# ── SNI split on :443 — phase 1 of #52 ───────────────────────────────────────
# Added 2026-09-03. Routes by SNI WITHOUT terminating, so the enclave can answer
# a TLS-ALPN-01 challenge on 443 (the only port a CA validates on) while
# enclave.ppq.ai keeps being terminated here exactly as before.
#   enclave-direct.ppq.ai -> raw TCP to the enclave (it terminates its own TLS)
#   everything else       -> 127.0.0.1:8444, the http server in conf.d/enclave.conf
#
# NO PROXY PROTOCOL. `proxy_protocol` takes a literal on/off, not a variable, so
# it cannot be enabled per-SNI -- and it must NOT reach enclave-direct, whose
# plain TLS server would read a PROXY header as ClientHello garbage. Enabling it
# for both is therefore not an option. The client address is not lost: this
# block logs the real $remote_addr below, and nothing downstream consumes it
# (server.mjs reads no x-forwarded-for).
#
# Rollback: delete this block, restore `listen 443 ssl;` in conf.d/enclave.conf,
# `nginx -t && systemctl reload nginx`.
stream {
    map $ssl_preread_server_name $enclave_upstream {
        enclave-direct.ppq.ai  127.0.0.1:8443;
        default                127.0.0.1:8444;
    }
    log_format sni '$remote_addr [$time_local] sni=$ssl_preread_server_name -> $upstream_addr $status $bytes_sent';
    access_log /var/log/nginx/sni-split.log sni;

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $enclave_upstream;
        proxy_timeout 300s;
        proxy_connect_timeout 10s;
    }
}

# ── replaces /etc/nginx/conf.d/enclave.conf ──────────────────────────────────
# Host TLS terminator for the browser path.
#
# Since 2026-09-03 this no longer listens on the wire: the stream block in
# nginx.conf owns :443, prereads SNI, and forwards here over loopback. Only the
# listen line changed; certificate, CORS and streaming behaviour are as before.
#
# The peer address is now loopback. That is deliberate and costs nothing:
# PROXY protocol cannot be enabled per-SNI (see nginx.conf), the stream block
# logs the real client address, and nothing downstream reads it.
server {
    listen 127.0.0.1:8444 ssl;
    server_name enclave.ppq.ai;

    ssl_certificate     /etc/letsencrypt/live/enclave.ppq.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enclave.ppq.ai/privkey.pem;

    location / {
        proxy_pass https://127.0.0.1:8443;   # -> socat -> vsock -> enclave
        proxy_ssl_verify off;                # enclave uses an ephemeral self-signed cert

        # The browser's ehbp client must READ this header from cross-origin JS
        # to decrypt the response; without it the fetch succeeds but the header
        # is hidden -> ProtocolError. Node ignores CORS, so it only bites in a
        # real browser.
        add_header 'Access-Control-Expose-Headers' 'Ehbp-Response-Nonce' always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}
