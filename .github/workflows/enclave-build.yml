name: Enclave build (PCR0)

# Builds the enclave image whenever the MEASURED source changes on main and
# publishes the resulting PCR0. It deliberately does NOT swap the running
# enclave or re-pin the frontend — see enclave-cutover.yml for why.
#
# Triggers are `push` to main and manual dispatch only. This repo is PUBLIC:
# a `pull_request` trigger would expose the AWS/Vercel secrets to fork PRs.
on:
  push:
    branches: [main]
    paths:
      # Everything the Dockerfile COPYs into the image is MEASURED — a change
      # to any of it moves PCR0 and needs a rebuild. boot.sh in particular is
      # the entrypoint and was missing here (found when #39 changed it; that
      # merge happened to also touch src/, so the build still fired).
      - 'enclave/src/**'
      - 'enclave/boot.sh'
      - 'enclave/package.json'
      - 'enclave/package-lock.json'
      - 'enclave/attest/**'
      - 'enclave/kmstool/**'
      - 'enclave/Dockerfile'
      - 'scripts/build-enclave.sh'
  workflow_dispatch:

concurrency:
  # One build at a time — they share a single EC2 box and its build dir.
  group: enclave-build
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: i-0609bf23c4b57a48e
  CHECKOUT: /home/ec2-user/ppq-enclave-proxy

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Sigstore build provenance over the measurement this run produces.
      # id-token mints the OIDC token that binds the attestation to THIS
      # workflow in THIS repo; attestations lets the run record it.
      id-token: write
      attestations: write
    steps:
      # Needed for scripts/ci-ssm-wait.sh. Nothing else in this job reads the
      # working tree — the build happens on the box, from the box's own
      # checkout, which the next step pins to GITHUB_SHA.
      - name: Check out this commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ENCLAVE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ENCLAVE_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync the build box to this commit
        run: |
          set -euo pipefail
          # Pin to the exact SHA that triggered the run, not origin/main — a
          # second merge landing mid-build would otherwise silently change what
          # gets measured, and PCR0 is only meaningful against a known commit.
          SHA="${GITHUB_SHA}"
          ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --parameters commands="[\"sudo chown -R ec2-user:ec2-user $CHECKOUT || true\",\"cd $CHECKOUT && sudo -u ec2-user git fetch origin --prune && sudo -u ec2-user git reset --hard $SHA && sudo -u ec2-user git log --oneline -1\"]" \
            --query Command.CommandId --output text)
          bash scripts/ci-ssm-wait.sh "$ID" "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query '{s:Status,o:StandardOutputContent,e:StandardErrorContent}' --output json | tee sync.json
          test "$(python3 -c 'import json;print(json.load(open("sync.json"))["s"])')" = Success

      - name: Build the enclave image
        run: |
          set -euo pipefail
          # HOME/NITRO_CLI_ARTIFACTS are load-bearing: SSM runs commands as root
          # with no HOME, and `nitro-cli build-enclave` then dies with E51
          # ("Could not find a folder for the CLI artifacts") AFTER the whole
          # Docker build has succeeded, which reads like a build failure but is
          # not. Cost a full rebuild to diagnose on 2026-08-24.
          ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 2400 \
            --parameters commands="[\"cd $CHECKOUT && rm -f build/PCR.json && mkdir -p /home/ec2-user/nitro-artifacts && HOME=/root NITRO_CLI_ARTIFACTS=/home/ec2-user/nitro-artifacts SOURCE_DATE_EPOCH=1704067200 bash scripts/build-enclave.sh 2>&1 | tail -40\"]" \
            --query Command.CommandId --output text)
          echo "ssm command: $ID"
          bash scripts/ci-ssm-wait.sh "$ID" "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query '{s:Status,o:StandardOutputContent,e:StandardErrorContent}' --output json > build.json
          python3 - <<'PY'
          import json,sys
          d=json.load(open('build.json'))
          print(d['o'][-3000:]); print('STDERR:', d['e'][-1000:])
          sys.exit(0 if d['s']=='Success' else 1)
          PY

      - name: Read PCR0
        id: pcr
        run: |
          set -euo pipefail
          ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters commands="[\"cat $CHECKOUT/build/PCR.json\"]" \
            --query Command.CommandId --output text)
          bash scripts/ci-ssm-wait.sh "$ID" "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text > PCR.json
          cat PCR.json
          PCR0=$(python3 -c 'import json;print(json.load(open("PCR.json"))["PCR0"])')
          echo "pcr0=$PCR0" >> "$GITHUB_OUTPUT"

      # Sigstore provenance over the measurement, so a client can trace it to a
      # specific run of THIS workflow in THIS public repo instead of trusting
      # what PayPerQ's API says the pin is. That is the difference between
      # "we say the enclave runs this code" and "you can check who produced the
      # number" — the property PUBLISHED_PCR.md asserts but cannot prove.
      #
      # The subject is PCR.json rather than the EIF: the 263MB image never
      # leaves the build box, while the measurement is the thing clients
      # actually pin. Attesting the file that carries PCR0 binds the value.
      - name: Attest the measurement
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: PCR.json

      # Keep the attested file retrievable — `gh attestation verify` needs the
      # bytes, and without this the provenance refers to something nobody can
      # download.
      - name: Upload the measurement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PCR.json
          path: PCR.json
          if-no-files-found: error

      - name: Publish the result
        run: |
          {
            echo "## Enclave built"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| **PCR0** | \`${{ steps.pcr.outputs.pcr0 }}\` |"
            echo
            echo "The running enclave and the frontend pin are **unchanged**."
            echo "To cut over, run the **Enclave cutover** workflow with this PCR0."
            echo
            echo "### Verify this measurement yourself"
            echo
            echo "Download the \`PCR.json\` artifact from this run, then:"
            echo
            echo '```'
            echo "gh attestation verify PCR.json --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "That proves the measurement came from this workflow in this"
            echo "public repo — not merely that PayPerQ asserts it."
          } >> "$GITHUB_STEP_SUMMARY"
